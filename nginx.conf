limit_req_zone $binary_remote_addr zone=translation_api:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;

    client_max_body_size 12m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(self), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        expires -1;
    }

    location = /fuel-prices.json {
        expires -1;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|ico|webp|woff2?)$ {
        expires 1h;
        try_files $uri =404;
    }

    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_backend api:3000;
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    location = /api/translate {
        limit_req zone=translation_api burst=10 nodelay;
        limit_req_status 429;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $translation_backend translation-api:3001;
        proxy_pass http://$translation_backend/translate;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Connection "";
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
