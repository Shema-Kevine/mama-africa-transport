<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">My reports</title>
  <desc id="desc">A stack of saved trip, fuel and maintenance report cards with an edit badge illustrates reviewing and editing previous reports.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173b35"/>
      <stop offset="1" stop-color="#022134"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <path d="M0 430 Q190 360 400 430 T780 420 T1200 380 V560 H0Z" fill="#0b6b4c"/>
  <path d="M0 496 Q220 428 480 486 T900 476 T1200 448 V560 H0Z" fill="#07563e"/>

  <!-- back card -->
  <rect x="140" y="120" width="330" height="150" rx="18" fill="#0d2b3d" stroke="#1d4a5e" stroke-width="4"/>
  <rect x="162" y="146" width="96" height="14" rx="7" fill="#2b5a70"/>
  <rect x="162" y="170" width="180" height="12" rx="6" fill="#1f4a5d"/>

  <!-- middle card -->
  <rect x="160" y="176" width="330" height="150" rx="18" fill="#123449" stroke="#265a72" stroke-width="4"/>
  <rect x="182" y="202" width="96" height="14" rx="7" fill="#3a6d84"/>
  <rect x="182" y="226" width="150" height="12" rx="6" fill="#2b5a70"/>

  <!-- front report card -->
  <rect x="180" y="232" width="340" height="158" rx="18" fill="#f7f1dc"/>
  <rect x="204" y="256" width="86" height="16" rx="8" fill="#d9c98f"/>
  <rect x="300" y="256" width="130" height="16" rx="8" fill="#e2d5a6"/>
  <rect x="204" y="288" width="292" height="12" rx="6" fill="#cfc098"/>
  <rect x="204" y="312" width="228" height="12" rx="6" fill="#cfc098"/>
  <rect x="204" y="336" width="140" height="12" rx="6" fill="#cfc098"/>
  <circle cx="204" cy="368" r="9" fill="#8dd6c0"/>
  <rect x="222" y="360" width="96" height="15" rx="7" fill="#cfc098"/>

  <!-- edit badge on the front card corner -->
  <circle cx="500" cy="252" r="32" fill="#025327" stroke="#fec119" stroke-width="5"/>
  <path d="M486 240 514 252 486 264 482 256Z" fill="#fec119"/>
  <path d="M482 256 486 264l4-4Z" fill="#fff8e5"/>

  <!-- plate / summary motif -->
  <rect x="620" y="150" width="480" height="162" rx="28" fill="#f7f1dc"/>
  <rect x="648" y="178" width="50" height="50" rx="11" fill="#fec119"/>
  <path d="M663 216a5 5 0 0 1 10 0c0 7-5 9-5 9s-5-2-5-9Z" fill="#022134"/>
  <rect x="712" y="186" width="150" height="18" rx="9" fill="#152b35"/>
  <rect x="712" y="212" width="104" height="14" rx="7" fill="#b9a97c"/>
  <rect x="830" y="180" width="242" height="14" rx="7" fill="#cfc098"/>
  <rect x="830" y="204" width="198" height="14" rx="7" fill="#cfc098"/>
  <rect x="830" y="228" width="150" height="14" rx="7" fill="#cfc098"/>
  <circle cx="874" cy="272" r="13" fill="#8dd6c0"/>
  <rect x="896" y="264" width="124" height="15" rx="7" fill="#cfc098"/>
  <rect x="712" y="262" width="96" height="15" rx="7" fill="#cfc098"/>

  <text x="620" y="382" font-family="Georgia, serif" font-size="48" fill="#fff8e5">My reports</text>
  <text x="620" y="424" font-family="system-ui, sans-serif" font-size="26" fill="#fec119">REVIEW · EDIT · RESUBMIT</text>
</svg>
